name: Build release zip

# До кожного релізу додає архів wc-nova-express.zip, у якому коренева тека
# називається wc-nova-express — тоді ручне встановлення ZIP завжди лягає в цю теку.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релізу (наприклад v2026.09.5)'
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build wc-nova-express.zip
        run: git archive --format=zip --prefix=wc-nova-express/ -o wc-nova-express.zip HEAD

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" wc-nova-express.zip --clobber
