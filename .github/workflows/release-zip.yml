name: Build release zip

# До кожного релізу додає архів wc-nova-express.zip, у якому коренева тека
# називається wc-nova-express — тоді ручне встановлення ZIP завжди лягає в цю теку.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релізу (наприклад v2026.09.9)'
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build wc-nova-express.zip
        run: git archive --format=zip --prefix=wc-nova-express/ -o wc-nova-express.zip HEAD

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" wc-nova-express.zip --clobber
          sleep 2
          ASSET_COUNT=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name == "wc-nova-express.zip" and .size > 0)] | length')
          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "::error::Release asset wc-nova-express.zip was not uploaded or is empty!"
            exit 1
          fi
          echo "Verified: wc-nova-express.zip attached successfully."
